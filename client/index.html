<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duly</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-36x36.png" />
  </head>
  <body
    class="min-h-screen bg-slate-950 p-4 px-6 py-10 shadow-2xl shadow-pink-500/10 backdrop-blur text-white"
  >
    <main
      class="relative min-h-full w-full overflow-hidden rounded-4xl border border-white/10 bg-slate-950/80 px-6 py-10 shadow-2xl shadow-pink-500/10 backdrop-blur"
    >
      <div
        class="absolute -top-24 left-1/2 h-48 w-48 -translate-x-1/2 rounded-full bg-pink-500/30 blur-3xl"
      ></div>

      <div
        class="absolute -bottom-24 right-0 h-48 w-48 rounded-full bg-cyan-400/20 blur-3xl"
      ></div>

      <section class="relative z-10">
        <p
          class="mb-3 text-center text-xs font-bold uppercase tracking-[0.3em] text-pink-300"
        >
          The tiny task manager
        </p>

        <h1
          class="mb-8 text-center text-5xl font-black leading-none tracking-tight text-white"
        >
          Duly
        </h1>

        <form id="todoForm" class="mb-8 grid gap-3">
          <div class="w-full flex gap-4">
            <!-- Inputfiled -->
            <label for="todoInput" class="sr-only">New todo</label>
            <input
              id="todoInput"
              name="todo"
              type="text"
              placeholder="Add a todo..."
              class="w-full min-h-14 rounded-2xl border border-white/10 bg-white/5 px-5 text-white placeholder:text-slate-400 outline-none backdrop-blur transition focus:border-pink-400 focus:ring-4 focus:ring-pink-400/20"
            />
            <!-- Vibe -->
            <label for="vibeSelect" class="sr-only">Todo vibe</label>

            <div class="relative">
              <select
                id="vibeSelect"
                name="vibe"
                required
                class="min-h-14 appearance-none rounded-2xl border border-white/10 bg-white/5 py-2 pl-2 pr-10 text-white outline-none backdrop-blur transition focus:border-pink-400 focus:ring-4 focus:ring-pink-400/20"
              >
                <option value="" disabled selected>Category</option>
                <option value="quick">Quick win</option>
                <option value="adulting">Adulting</option>
                <option value="cursed">Cursed</option>
                <option value="iconic">Iconic</option>
              </select>

              <span
                class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2"
              >
                <svg
                  width="15"
                  height="10"
                  viewBox="0 0 20 11"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M1.68626 0.295606C1.59084 0.20118 1.4786 0.12736 1.35595 0.0783611C1.23329 0.0293619 1.10262 0.00614255 0.971395 0.0100301C0.84017 0.0139177 0.710961 0.0448357 0.591145 0.101018C0.47133 0.157201 0.363254 0.237548 0.273089 0.337472C0.182924 0.437396 0.112435 0.554941 0.0656467 0.683395C0.0188586 0.811848 -0.0033124 0.948694 0.000399767 1.08612C0.00411193 1.22355 0.0336344 1.35886 0.0872817 1.48434C0.140929 1.60982 0.21765 1.723 0.313065 1.81743L9.30779 10.7139C9.49335 10.8976 9.73902 11 9.99438 11C10.2497 11 10.4954 10.8976 10.681 10.7139L19.6767 1.81743C19.7742 1.72362 19.8529 1.61047 19.9083 1.48453C19.9637 1.35859 19.9947 1.22238 19.9994 1.08381C20.0041 0.945238 19.9824 0.807071 19.9357 0.677332C19.889 0.547593 19.8181 0.428869 19.7272 0.328055C19.6363 0.227242 19.5272 0.146349 19.4062 0.0900744C19.2852 0.0338003 19.1547 0.00326721 19.0223 0.0002482C18.89 -0.00277081 18.7584 0.0217842 18.6351 0.0724879C18.5119 0.123192 18.3995 0.199033 18.3045 0.295606L9.99438 8.51386L1.68626 0.295606Z"
                    fill="#FF49C1"
                  />
                </svg>
              </span>
            </div>
          </div>
          <button
            type="submit"
            class="min-h-14 rounded-2xl border border-pink-200/40 bg-pink-600/30 px-6 font-black text-pink-50 backdrop-blur-md transition hover:-translate-y-0.5 hover:border-pink-200/70 hover:bg-pink-300/30 focus:outline-none focus:ring-4 focus:ring-pink-300/20"
          >
            Add
          </button>
        </form>

        <ul id="todoList" class="grid gap-4"></ul>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
